# Netlify: build the Vite app and publish the compiled output (not the source).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ / 22.12+.
  NODE_VERSION = "22"

# Hashed assets never change, so cache them hard; index.html always revalidates.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
